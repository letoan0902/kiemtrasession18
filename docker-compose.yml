name: shopmart

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: shopmart-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - shopmart-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: shopmart-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - shopmart-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: shopmart-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Đang chờ Kafka tại kafka:29092 ..."
        until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          sleep 2
        done
        echo "Kafka đã sẵn sàng, tạo topic order và payment"
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payment --partitions 3 --replication-factor 1
        echo "Danh sách topic hiện có:"
        kafka-topics --bootstrap-server kafka:29092 --list
        kafka-topics --bootstrap-server kafka:29092 --describe --topic order
        kafka-topics --bootstrap-server kafka:29092 --describe --topic payment
    restart: "no"
    networks:
      - shopmart-net

  redis:
    image: redis:7-alpine
    container_name: shopmart-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shopmart-net

networks:
  shopmart-net:
    name: shopmart-net
    driver: bridge
