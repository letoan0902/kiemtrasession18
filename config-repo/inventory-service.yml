spring:
  datasource:
    url: jdbc:mysql://${shopmart.mysql.host}:${shopmart.mysql.port}/shopmart_inventory_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    username: ${shopmart.mysql.username}
    password: ${shopmart.mysql.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
    show-sql: false

  sql:
    init:
      mode: always
      encoding: UTF-8

  data:
    redis:
      host: localhost
      port: 6379
      client-type: lettuce
      timeout: 2s
      connect-timeout: 1s
      repositories:
        enabled: false

  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: "shopmart:"

  kafka:
    consumer:
      group-id: inventory-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
