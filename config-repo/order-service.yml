spring:
  datasource:
    url: jdbc:mysql://${shopmart.mysql.host}:${shopmart.mysql.port}/shopmart_order_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    username: ${shopmart.mysql.username}
    password: ${shopmart.mysql.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  cloud:
    openfeign:
      client:
        config:
          inventory-service:
            connect-timeout: 2000
            read-timeout: 3000
            logger-level: basic

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.shopmart.order.exception.InventoryUnavailableException
          - feign.RetryableException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.shopmart.order.exception.ProductNotFoundException
          - com.shopmart.order.exception.InsufficientStockException

management:
  health:
    circuitbreakers:
      enabled: true

shopmart:
  saga:
    payment-timeout-seconds: 15
